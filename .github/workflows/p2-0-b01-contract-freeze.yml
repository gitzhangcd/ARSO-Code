name: P2.0 B01 + Shared-Core contract verification

on:
  pull_request:
    branches:
      - main
      - p2-0-b01-contract-recovery

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full normative source checksums
        run: |
          test "$(wc -l < specs/SPEC_SOURCE_CHECKSUMS.sha256)" -eq 9
          sha256sum -c specs/SPEC_SOURCE_CHECKSUMS.sha256

      - name: Verify shared-core registered digest
        run: |
          expected="$(grep 'DI_Shared_Canonical_Shell_Exact_V1_Contract.md' specs/SPEC_SOURCE_CHECKSUMS.sha256 | awk '{print $1}')"
          actual="$(sha256sum specs/00-CODE-FREEZE/DI_Shared_Canonical_Shell_Exact_V1_Contract.md | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "shared-core contract digest: $actual"

      - name: B01 surface coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('specs/00-CODE-FREEZE/DI_B01_Exact_V1_Owner_Contract.md').read_text(encoding='utf-8')
          objects = [
              'StyleBrief',
              'DesignContextBinding',
              'DesignDecision',
              'DesignRoute',
              'DesignSpec',
              'ReferenceIntentBinding',
              'DesignTaskBinding',
          ]
          missing = []
          for name in objects:
              pattern = rf'^#{{1,3}}\s+(?:\d+(?:\.\d+)?\.?\s+)?{re.escape(name)}\s*$'
              if re.search(pattern, text, flags=re.MULTILINE) is None:
                  missing.append(name)
          if missing:
              raise SystemExit(f'missing B01 object sections: {missing}')
          print(f'B01 canonical object coverage: {len(objects)}/7')
          PY

      - name: Shared-core surface coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('specs/00-CODE-FREEZE/DI_Shared_Canonical_Shell_Exact_V1_Contract.md').read_text(encoding='utf-8')
          required = [
              'ActorId', 'ActorType', 'ActorRef',
              'TenantId', 'TenantScopeType', 'TenantScope',
              'Provenance', 'ObjectRevision',
              'CanonicalObject Structural Base',
              'CanonicalRevision Structural Base',
              'ImmutableFact Structural Base',
          ]
          missing = []
          for name in required:
              pattern = rf'^#{{1,3}}\s+(?:\d+(?:\.\d+)?\.?\s+)?{re.escape(name)}\s*$'
              if re.search(pattern, text, flags=re.MULTILINE) is None:
                  missing.append(name)
          if missing:
              raise SystemExit(f'missing shared-core sections: {missing}')
          print(f'shared-core required section coverage: {len(required)}/{len(required)}')
          PY

      - name: No P2.0A production implementation leakage
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          if echo "$changed" | grep -E '^src/design_intelligence/contracts/b01/.*\.py$'; then
            echo 'P2.0/P2.0A must not add B01 production Python models'
            exit 1
          fi
          if echo "$changed" | grep -E '^src/design_intelligence/contracts/core/.*\.py$'; then
            echo 'P2.0A must not modify production core Python contracts before shared-core freeze'
            exit 1
          fi

      - name: P0 P1 regression
        run: |
          python -m pip install -e '.[test]'
          PYTHONPATH=src python -m pytest -q
          cd di_contracts_v1
          PYTHONPATH=. python -m pytest -q

      - name: Compile frozen production package
        run: python -m compileall -q src/design_intelligence

      - name: Placeholder scan
        run: |
          if grep -RInE '\b(TBD|TODO|FIXME)\b' \
            B01_SOURCE_RECOVERY_MATRIX.md \
            B01_FIELD_DECISION_LEDGER.md \
            B01_CROSS_SPEC_FREEZE_AUDIT.md \
            B01_P2_0_FREEZE_REVIEW.md \
            SHARED_CORE_SOURCE_RECOVERY_MATRIX.md \
            SHARED_CORE_FIELD_DECISION_LEDGER.md \
            SHARED_CORE_CROSS_SPEC_FREEZE_AUDIT.md \
            docs/superpowers/specs/2026-09-04-p2-0-b01-contract-recovery-design.md \
            docs/superpowers/plans/2026-09-04-p2-0-b01-contract-recovery-implementation.md \
            docs/superpowers/specs/2026-09-05-p2-0a-shared-canonical-shell-recovery-design.md \
            docs/superpowers/plans/2026-09-05-p2-0a-shared-canonical-shell-recovery-implementation.md \
            specs/00-CODE-FREEZE/DI_B01_Exact_V1_Owner_Contract.md \
            specs/00-CODE-FREEZE/DI_Shared_Canonical_Shell_Exact_V1_Contract.md; then
            echo 'placeholder found in P2.0/P2.0A normative/recovery artifacts'
            exit 1
          fi

      - name: Non-Markdown patch whitespace check
        run: >-
          git diff --check origin/main...HEAD -- .
          ':(glob,exclude)**/*.md'
          ':(glob,exclude)*.md'

      - name: Markdown trailing whitespace policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMR', 'origin/main...HEAD'],
              text=True,
          ).splitlines()
          errors = []
          for name in changed:
              if not name.endswith('.md'):
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  trailing = line[len(line.rstrip(' \t')):]
                  if trailing and trailing != '  ':
                      errors.append(f'{name}:{line_no}: invalid trailing whitespace {trailing!r}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Authority-source scope gate
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- specs/)"
          unexpected="$(echo "$changed" | grep -v -E '^(specs/00-CODE-FREEZE/DI_B01_Exact_V1_Owner_Contract\.md|specs/00-CODE-FREEZE/DI_Shared_Canonical_Shell_Exact_V1_Contract\.md|specs/SPEC_SOURCE_CHECKSUMS\.sha256)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'P2.0/P2.0A changed authority sources outside scoped contracts/manifest:'
            echo "$unexpected"
            exit 1
          fi
