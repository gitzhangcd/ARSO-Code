name: P2.0 B01 contract freeze verification

on:
  pull_request:
    branches:
      - main

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve original seven source checksums
        run: |
          head -n 7 specs/SPEC_SOURCE_CHECKSUMS.sha256 > /tmp/original-seven.sha256
          sha256sum -c /tmp/original-seven.sha256

      - name: Generate B01 owner contract SHA-256
        run: sha256sum specs/00-CODE-FREEZE/DI_B01_Exact_V1_Owner_Contract.md | tee /tmp/b01-owner.sha256

      - name: Upload B01 owner checksum evidence
        uses: actions/upload-artifact@v4
        with:
          name: b01-owner-checksum
          path: /tmp/b01-owner.sha256
          if-no-files-found: error
          retention-days: 1

      - name: B01 surface coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('specs/00-CODE-FREEZE/DI_B01_Exact_V1_Owner_Contract.md').read_text(encoding='utf-8')
          objects = [
              'StyleBrief',
              'DesignContextBinding',
              'DesignDecision',
              'DesignRoute',
              'DesignSpec',
              'ReferenceIntentBinding',
              'DesignTaskBinding',
          ]
          missing = []
          for name in objects:
              pattern = rf'^#{{1,3}}\s+(?:\d+(?:\.\d+)?\.?\s+)?{re.escape(name)}\s*$'
              if re.search(pattern, text, flags=re.MULTILINE) is None:
                  missing.append(name)
          if missing:
              raise SystemExit(f'missing B01 object sections: {missing}')
          print(f'B01 canonical object coverage: {len(objects)}/7')
          PY

      - name: No P2 production implementation leakage
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          if echo "$changed" | grep -E '^src/design_intelligence/contracts/b01/.*\.py$'; then
            echo 'P2.0 must not add B01 production Python models'
            exit 1
          fi

      - name: P0 P1 regression
        run: |
          python -m pip install -e '.[test]'
          PYTHONPATH=src python -m pytest -q
          cd di_contracts_v1
          PYTHONPATH=. python -m pytest -q

      - name: Compile frozen production package
        run: python -m compileall -q src/design_intelligence

      - name: Placeholder scan
        run: |
          if grep -RInE '\b(TBD|TODO|FIXME)\b' \
            B01_SOURCE_RECOVERY_MATRIX.md \
            B01_FIELD_DECISION_LEDGER.md \
            docs/superpowers/specs/2026-09-04-p2-0-b01-contract-recovery-design.md \
            docs/superpowers/plans/2026-09-04-p2-0-b01-contract-recovery-implementation.md \
            specs/00-CODE-FREEZE/DI_B01_Exact_V1_Owner_Contract.md; then
            echo 'placeholder found in P2.0 normative/recovery artifacts'
            exit 1
          fi

      - name: Non-Markdown patch whitespace check
        run: >-
          git diff --check origin/main...HEAD -- .
          ':(glob,exclude)**/*.md'
          ':(glob,exclude)*.md'

      - name: Markdown trailing whitespace policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMR', 'origin/main...HEAD'],
              text=True,
          ).splitlines()
          errors = []
          for name in changed:
              if not name.endswith('.md'):
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  trailing = line[len(line.rstrip(' \t')):]
                  if trailing and trailing != '  ':
                      errors.append(f'{name}:{line_no}: invalid trailing whitespace {trailing!r}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Authority-source scope gate
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- specs/)"
          unexpected="$(echo "$changed" | grep -v -E '^(specs/00-CODE-FREEZE/DI_B01_Exact_V1_Owner_Contract\.md|specs/SPEC_SOURCE_CHECKSUMS\.sha256)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'P2.0 changed authority sources outside its scoped owner contract/manifest:'
            echo "$unexpected"
            exit 1
          fi
