name: P2 AC-01 schema artifact export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Export deterministic B01 schemas
        run: PYTHONPATH=src python tools/export_b01_json_schemas.py
      - name: Upload generated schemas
        uses: actions/upload-artifact@v4
        with:
          name: p2-ac01-json-schema
          path: generated/json_schema/di.b01.*.schema.json
          if-no-files-found: error
      - name: Commit generated schemas to the P2 branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/json_schema/di.b01.*.schema.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: commit generated B01 JSON schemas"
          git push origin HEAD:${GITHUB_HEAD_REF}
