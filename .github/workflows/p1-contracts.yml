name: P1 contract verification

on:
  pull_request:
    branches:
      - main

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project tests
        run: python -m pip install -e '.[test]'
      - name: P1 targeted tests
        run: >-
          PYTHONPATH=src python -m pytest
          tests/unit/test_p1_refs.py
          tests/schemas/test_p1_reference_schemas.py
          tests/hashing
          tests/cross_language
          tests/registry
          tests/repository/test_p1_scope.py -q
      - name: Root tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Candidate baseline regression
        run: cd di_contracts_v1 && PYTHONPATH=. python -m pytest -q
      - name: Specification checksums
        run: sha256sum -c specs/SPEC_SOURCE_CHECKSUMS.sha256
      - name: Compile production package
        run: python -m compileall -q src/design_intelligence
      - name: Patch whitespace check
        run: git diff --check origin/main...HEAD
      - name: Authoritative source drift check
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- specs/ di_contracts_v1/)"
          if [ -n "$changed" ]; then
            echo "P1 must not modify authoritative specs or candidate baseline:"
            echo "$changed"
            exit 1
          fi
