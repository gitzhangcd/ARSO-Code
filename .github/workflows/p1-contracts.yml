name: P1 contract verification

on:
  pull_request:
    branches:
      - main

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project tests
        run: python -m pip install -e '.[test]'
      - name: P1 targeted tests
        run: >-
          PYTHONPATH=src python -m pytest
          tests/unit/test_p1_refs.py
          tests/schemas/test_p1_reference_schemas.py
          tests/hashing
          tests/cross_language
          tests/registry
          tests/repository/test_p1_scope.py -q
      - name: Root tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Candidate baseline regression
        run: cd di_contracts_v1 && PYTHONPATH=. python -m pytest -q
      - name: Specification checksums
        run: sha256sum -c specs/SPEC_SOURCE_CHECKSUMS.sha256
      - name: Compile production package
        run: python -m compileall -q src/design_intelligence
      - name: Non-Markdown patch whitespace check
        run: >-
          git diff --check origin/main...HEAD -- .
          ':(glob,exclude)**/*.md'
          ':(glob,exclude)*.md'
      - name: Markdown trailing whitespace policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", "origin/main...HEAD"],
              text=True,
          ).splitlines()
          errors: list[str] = []
          for name in changed:
              if not name.endswith(".md"):
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  trailing = line[len(line.rstrip(" \t")):]
                  if trailing and trailing != "  ":
                      errors.append(f"{name}:{line_no}: invalid trailing whitespace {trailing!r}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY
      - name: Frozen source and candidate-baseline drift check
        run: |
          changed_baseline="$(git diff --name-only origin/main...HEAD -- di_contracts_v1/)"
          if [ -n "$changed_baseline" ]; then
            echo "Candidate baseline must remain read-only:"
            echo "$changed_baseline"
            exit 1
          fi

          original_sources="$(head -n 7 specs/SPEC_SOURCE_CHECKSUMS.sha256 | awk '{print $2}')"
          drifted=""
          for path in $original_sources; do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              drifted="$drifted\n$path"
            fi
          done
          if [ -n "$drifted" ]; then
            echo "Frozen original authority sources changed:"
            printf '%b\n' "$drifted"
            exit 1
          fi

          echo "Original frozen sources unchanged; scoped checksum-registered owner contracts are allowed."
